name: Release

# Push a tag like v0.2.0 (matching package.json's version) to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the oldest Node the release supports; 26 is the current LTS.
        node: [22, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # No dependency cache in a release workflow, so a poisoned cache can't reach a published build.
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Bump the version, commit, then tag v$version."
            exit 1
          fi

      - run: npm ci
      - run: npm run release

      - name: Smoke-test the built server
        run: |
          name="agent-status-${GITHUB_REF_NAME#v}"
          mkdir smoke && tar -xzf "release/$name.tar.gz" -C smoke
          PORT=7799 DATA_DIR="$RUNNER_TEMP/as" "smoke/$name/start.sh" &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:7799/ && break; sleep 0.5; done
          curl -sf -o /dev/null http://127.0.0.1:7799/
          curl -sf -X POST -H 'content-type: application/json' -d '{"agent":"opencode","sessionId":"ci","event":"idle"}' http://127.0.0.1:7799/events
          curl -sf http://127.0.0.1:7799/api/sessions | grep -q '"sessionId":"ci"'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="agent-status-${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          Unpack and run with Node 22 or later. Nothing else is downloaded.

          \`\`\`bash
          tar -xzf $name.tar.gz && cd $name
          ./start.sh                       # board on http://127.0.0.1:7777
          node install-claude-hooks.mjs    # connect Claude Code
          \`\`\`

          See the README in the tarball for the OpenCode plugin. Verify the download with \`shasum -a 256 -c $name.tar.gz.sha256\`.
          EOF
          gh release create "$GITHUB_REF_NAME" "release/$name.tar.gz" "release/$name.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
