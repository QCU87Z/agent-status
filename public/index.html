<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* A triage board: what needs you first, then what's working, ended last. State is carried by colour + label. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --ink: #1b1f27; --muted: #5d6573; --line: #dde1e7; --accent: #3a5bd9;
  --perm: #c2410c; --perm-soft: #fff1e8; --prompt: #a16207; --prompt-soft: #fdf6dc;
  --work: #15803d; --work-soft: #e8f6ec; --dead: #7b8290; --dead-soft: #eef0f3; --err: #b91c1c; --err-soft: #fdecec;
  --claude: #b4542f; --opencode: #2f5fb4;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --surface: #1a1e26; --ink: #e6e9ef; --muted: #98a0ae; --line: #2a303b; --accent: #7d97ff;
    --perm: #fb8a4c; --perm-soft: #3a2116; --prompt: #e8b93a; --prompt-soft: #332a12;
    --work: #4ccf7c; --work-soft: #15301f; --dead: #8a919e; --dead-soft: #22262e; --err: #f87171; --err-soft: #3a1a1a;
    --claude: #e0855e; --opencode: #7ea2ec;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 20px 48px; display: grid; gap: 20px; }
.wrap.wide { max-width: 1400px; }
button { font: inherit; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px; }
.conn { font: 12px var(--font-mono); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--work); }
.conn.off .dot { background: var(--err); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.chip b { font-weight: 600; }
.chip.need b { color: var(--perm); } .chip.work b { color: var(--work); }
.btn { font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.views { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.views button { font-size: 13px; padding: 4px 10px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
.views button + button { border-left: 1px solid var(--line); }
.views button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.views button:focus-visible { outline-offset: -2px; }

.banner { padding: 10px 14px; border-radius: 8px; background: var(--err-soft); color: var(--err); font-size: 14px; border: 1px solid color-mix(in srgb, var(--err) 30%, transparent); }
#main { display: grid; gap: 22px; }
section { display: grid; gap: 10px; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; display: inline-flex; gap: 8px; align-items: baseline; }
.quiet { padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; }
.list { display: grid; gap: 10px; }

.s-waiting_permission { --c: var(--perm); --soft: var(--perm-soft); }
.s-waiting_prompt { --c: var(--prompt); --soft: var(--prompt-soft); }
.s-working { --c: var(--work); --soft: var(--work-soft); }
.s-error { --c: var(--err); --soft: var(--err-soft); }
.s-ended, .s-stale { --c: var(--dead); --soft: var(--dead-soft); }

.agent { font: 500 11px var(--font-mono); padding: 1px 6px; border-radius: 4px; color: #fff; flex: none; }
.agent.claude { background: var(--claude); } .agent.opencode { background: var(--opencode); }
.proj { font-weight: 600; }
.title { color: var(--muted); overflow-wrap: anywhere; }
.age { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.age.old { color: var(--perm); }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--work); display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.card { display: grid; grid-template-columns: 4px 1fr auto; gap: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stripe { background: var(--c); }
.body { padding: 12px 0; min-width: 0; display: grid; gap: 4px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.what { font-size: 14px; overflow-wrap: anywhere; }
.what code { font: 13px var(--font-mono); background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.meta { font: 12px var(--font-mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; overflow-wrap: anywhere; }
.side { padding: 12px 14px 12px 0; display: grid; justify-items: end; align-content: start; gap: 6px; text-align: right; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; color: var(--c); background: var(--soft); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.s-ended .proj, .s-ended .what { color: var(--muted); }
.dismiss { font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }

details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary h2::before { content: ''; display: inline-block; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; margin-right: 2px; transition: transform .15s; }
details[open] > summary h2::before { transform: rotate(90deg); }
details[open] > .list, details[open] > .grid { margin-top: 10px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 6px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
.tile.need { background: var(--soft); border-color: color-mix(in srgb, var(--c) 35%, var(--line)); border-top-color: var(--c); }
.tile .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tile .proj { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .title { font-size: 12.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.7em; }
.tile .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 2px; }
.tile .state { font-size: 11.5px; font-weight: 600; color: var(--c); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.tile .age { font-size: 12px; }
.tile.s-ended { opacity: .6; }

.empty { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 10px; max-width: 70ch; }
.empty h3 { margin: 0; font-size: 16px; }
.empty p { margin: 0; color: var(--muted); }
.empty pre { margin: 0; font: 12.5px/1.5 var(--font-mono); background: var(--bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }

@media (prefers-reduced-motion: reduce) { .live { animation: none; } details > summary h2::before { transition: none; } }
@media (max-width: 520px) {
  .card { grid-template-columns: 4px 1fr; }
  .side { grid-column: 2; justify-items: start; text-align: left; padding: 0 0 12px; grid-auto-flow: column; justify-content: start; align-items: center; }
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <h1>Agent status <span class="conn" id="conn"><span class="dot"></span><span id="connText">connecting…</span></span></h1>
    <div class="tools">
      <span id="tally" class="tools"></span>
      <button class="btn" type="button" id="notify">Turn on notifications</button>
      <div class="views" role="group" aria-label="Layout">
        <button type="button" data-v="grid">Grid</button>
        <button type="button" data-v="list">List</button>
      </div>
    </div>
  </header>
  <div id="banner"></div>
  <div id="main"></div>
</div>

<script>
const sessions = new Map();
const NEED = ['waiting_permission', 'error', 'waiting_prompt'];
const ORDER = { waiting_permission: 0, error: 1, waiting_prompt: 2 };
const LABEL = { waiting_permission: 'Needs permission', waiting_prompt: 'Waiting for prompt', working: 'Working', error: 'Error', stale: 'Stale?', ended: 'Ended' };
const SHORT = { waiting_permission: 'Permission', waiting_prompt: 'Your turn', working: 'Working', error: 'Error', stale: 'Stale?', ended: 'Ended' };
const OLD_WAIT = 10 * 60_000;

const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let view = store.get('view', 'grid');
let notifyOn = store.get('notify', 'off') === 'on' && 'Notification' in window && Notification.permission === 'granted';
let connected = false;
let everConnected = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const home = s => String(s ?? '').replace(/^\/(Users|home)\/[^/]+/, '~');

function fmt(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ' + String(s % 60).padStart(2, '0') + 's';
  return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
}
function agoText(ms) {
  const s = Math.round(ms / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}

function what(x) {
  if (x.state === 'working' && x.lastTool && x.detail && !x.detail.startsWith('Finished') && x.detail !== 'Thinking…') {
    return `Running <code>${esc(x.lastTool)}</code> · <code>${esc(x.detail)}</code>`;
  }
  if (x.state === 'working' && x.lastTool && !x.detail) return `Running <code>${esc(x.lastTool)}</code>`;
  if (x.state === 'waiting_permission' && x.lastTool && x.detail && !/permission/i.test(x.detail)) {
    return `Wants to use <code>${esc(x.lastTool)}</code> · <code>${esc(x.detail)}</code>`;
  }
  return esc(x.detail);
}

function age(x) {
  if (x.state === 'ended') return '';
  const old = NEED.includes(x.state) && Date.now() - x.stateSince > OLD_WAIT;
  return `<span class="age${old ? ' old' : ''}" data-since="${x.stateSince}">${fmt(Date.now() - x.stateSince)}</span>`;
}

const badge = x => `<span class="agent ${x.agent}" title="${x.agent === 'claude' ? 'Claude Code' : 'OpenCode'}">${x.agent === 'claude' ? 'cc' : 'oc'}</span>`;
const live = x => (x.state === 'working' ? '<span class="live"></span>' : '');
const title = x => esc(x.title || (x.agent === 'claude' ? 'New session' : 'Untitled session'));

function card(x) {
  return `<article class="card s-${x.state}">
    <div class="stripe"></div>
    <div class="body">
      <div class="top">${badge(x)}<span class="proj">${esc(x.project || 'unknown')}</span><span class="title">${title(x)}</span></div>
      <div class="what">${what(x)}</div>
      <div class="meta"><span>${esc(home(x.cwd))}</span>${x.pid ? `<span>pid ${x.pid}</span>` : ''}<span data-seen="${x.lastSeenAt}">seen ${agoText(Date.now() - x.lastSeenAt)}</span></div>
    </div>
    <div class="side">
      <span class="pill">${live(x)}${LABEL[x.state]}</span>
      ${age(x)}
      ${x.state === 'ended' || x.state === 'stale' ? `<button class="dismiss" type="button" data-dismiss="${esc(x.key)}">Dismiss</button>` : ''}
    </div>
  </article>`;
}

function tile(x) {
  const need = NEED.includes(x.state);
  return `<article class="tile s-${x.state}${need ? ' need' : ''}" title="${esc(home(x.cwd))}${x.detail ? '\n' + esc(x.detail) : ''}">
    <div class="row">${badge(x)}<span class="proj">${esc(x.project || 'unknown')}</span></div>
    <div class="title">${title(x)}</div>
    <div class="foot"><span class="state">${live(x)}${SHORT[x.state]}</span>${age(x)}</div>
  </article>`;
}

function render() {
  const list = [...sessions.values()];
  const need = list.filter(x => NEED.includes(x.state)).sort((a, b) => (ORDER[a.state] - ORDER[b.state]) || (a.stateSince - b.stateSince));
  const work = list.filter(x => x.state === 'working').sort((a, b) => a.stateSince - b.stateSince);
  const done = list.filter(x => x.state === 'ended' || x.state === 'stale').sort((a, b) => b.stateSince - a.stateSince);

  document.title = (need.length ? `(${need.length}) ` : '') + 'Agent status';
  document.getElementById('wrap').classList.toggle('wide', view === 'grid');
  document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === view)));
  const nb = document.getElementById('notify');
  nb.hidden = !('Notification' in window);
  nb.setAttribute('aria-pressed', String(notifyOn));
  nb.textContent = notifyOn ? 'Notifications on' : 'Turn on notifications';

  document.getElementById('conn').classList.toggle('off', !connected);
  document.getElementById('connText').textContent = connected ? location.host : everConnected ? 'disconnected' : 'connecting…';
  document.getElementById('banner').innerHTML = !connected && everConnected
    ? `<div class="banner" role="status">Lost connection to the status server at ${esc(location.host)}. Retrying automatically. The list below may be out of date.</div>` : '';

  document.getElementById('tally').innerHTML = list.length ? `
    <span class="chip need"><b>${need.length}</b> need you</span>
    <span class="chip work"><b>${work.length}</b> working</span>
    <span class="chip"><b>${done.length}</b> ended</span>` : '';

  const main = document.getElementById('main');
  const openEnded = main.querySelector('details')?.open ?? false;
  if (!list.length) {
    main.innerHTML = everConnected ? `<div class="empty">
      <h3>No sessions have checked in yet</h3>
      <p>The server is running. Start a Claude Code or OpenCode session with the integration installed and it will show up here as soon as it sends its first event.</p>
      <p><b>Claude Code</b>: merge <code>integrations/claude/hooks.json</code> into <code>~/.claude/settings.json</code>.</p>
      <p><b>OpenCode</b>: copy the plugin into your global plugins folder.</p>
      <pre>mkdir -p ~/.config/opencode/plugins
cp integrations/opencode/status.ts ~/.config/opencode/plugins/agent-status.ts</pre>
    </div>` : '';
    return;
  }
  if (view === 'grid') {
    main.innerHTML = `${need.length + work.length ? `<div class="grid">${[...need, ...work].map(tile).join('')}</div>` : `<div class="quiet">No active sessions.</div>`}
      ${done.length ? `<details${openEnded ? ' open' : ''}><summary><h2>Ended and stale <span>${done.length}</span></h2></summary><div class="grid">${done.map(tile).join('')}</div></details>` : ''}`;
    return;
  }
  main.innerHTML = `
    <section aria-labelledby="h-need">
      <h2 id="h-need">Needs you <span>${need.length}</span></h2>
      ${need.length ? `<div class="list">${need.map(card).join('')}</div>` : `<div class="quiet">Nothing is waiting on you.</div>`}
    </section>
    <section aria-labelledby="h-work">
      <h2 id="h-work">Working <span>${work.length}</span></h2>
      ${work.length ? `<div class="list">${work.map(card).join('')}</div>` : `<div class="quiet">No session is working right now.</div>`}
    </section>
    ${done.length ? `<details${openEnded ? ' open' : ''}><summary><h2>Ended and stale <span>${done.length}</span></h2></summary><div class="list">${done.map(card).join('')}</div></details>` : ''}`;
}

function notifyIfNeeded(prev, next) {
  if (!notifyOn || !NEED.includes(next.state) || prev?.state === next.state) return;
  try {
    const n = new Notification(`${next.project || 'Session'}: ${LABEL[next.state]}`, {
      body: next.detail || next.title || '', tag: next.key, silent: false,
    });
    n.onclick = () => { window.focus(); n.close(); };
  } catch {}
}

function connect() {
  const es = new EventSource('/stream');
  es.addEventListener('open', () => { connected = true; everConnected = true; render(); });
  es.addEventListener('error', () => { connected = false; render(); });
  es.addEventListener('snapshot', ev => {
    sessions.clear();
    for (const s of JSON.parse(ev.data)) sessions.set(s.key, s);
    connected = true; everConnected = true;
    render();
  });
  es.addEventListener('session', ev => {
    const s = JSON.parse(ev.data);
    notifyIfNeeded(sessions.get(s.key), s);
    sessions.set(s.key, s);
    render();
  });
  es.addEventListener('remove', ev => { sessions.delete(JSON.parse(ev.data)); render(); });
}

document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.v; store.set('view', view); render();
}));
document.getElementById('notify').addEventListener('click', async () => {
  if (notifyOn) { notifyOn = false; store.set('notify', 'off'); return render(); }
  const p = await Notification.requestPermission();
  notifyOn = p === 'granted';
  store.set('notify', notifyOn ? 'on' : 'off');
  render();
});
document.getElementById('main').addEventListener('click', e => {
  const key = e.target.closest('[data-dismiss]')?.dataset.dismiss;
  if (key) fetch('/api/sessions/' + encodeURIComponent(key), { method: 'DELETE' });
});

setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-since]').forEach(el => {
    el.textContent = fmt(now - Number(el.dataset.since));
    const card = el.closest('.s-waiting_permission, .s-waiting_prompt, .s-error');
    el.classList.toggle('old', !!card && now - Number(el.dataset.since) > OLD_WAIT);
  });
  document.querySelectorAll('[data-seen]').forEach(el => { el.textContent = 'seen ' + agoText(now - Number(el.dataset.seen)); });
}, 1000);

render();
connect();
</script>
</body>
</html>
